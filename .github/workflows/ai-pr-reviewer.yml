name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        # 🌟 매우 안정적인 다른 액션으로 교체
        uses: stefanzweifel/git-auto-commit-action@v5 # (선택사항: 리뷰 후 자동 커밋이 필요할 때)

      - name: OpenAI PR Reviewer
        uses: midudev/chatgpt-action@v0.2.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: gpt-4o
          language: ko-KR # 한국어 설정