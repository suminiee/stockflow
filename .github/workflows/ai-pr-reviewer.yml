name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions: #권한설정
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: anc95/ChatGPT-CodeReview@main # 오픈소스 액션 활용
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 한국어 리뷰
          LANGUAGE: Korean
          MODEL: gpt-4o # 또는 gpt-3.5-turbo